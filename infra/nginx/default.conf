# Sert les éditions écrites par Airflow dans le volume "editions" (lecture seule).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /srv/editions;
    charset utf-8;

    # Liste des éditions (archives) tant qu'il n'y a pas d'index.html.
    autoindex on;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Afficher le Markdown dans le navigateur au lieu de le télécharger.
    location ~ \.md$ {
        default_type text/plain;
    }
}
