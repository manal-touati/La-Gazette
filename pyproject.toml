[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gazette"
version = "0.1.0"
description = "La gazette : chaque matin, les grands thèmes de la presse française à partir des flux RSS."
readme = "README.md"
requires-python = ">=3.12"
# Airflow n'est pas listé : il est fourni par son image (infra/airflow/Dockerfile).
dependencies = [
    "feedparser>=6.0.11",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Regroupement par thèmes : ajouté au TD correspondant (lourd : torch, BERTopic).
themes = [
    "sentence-transformers>=6.0",
    "bertopic>=0.17",
]
dev = [
    "pytest>=8",
    "ruff>=0.17,<0.18",
]

[project.scripts]
gazette = "gazette.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gazette = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
